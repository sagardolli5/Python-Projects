{% extends 'base.html' %}
{% block title %}Taskly{% endblock %}
{% block content %}

<!-- invisible anchor target for signup tab -->
<div class="login-page">
<span id="signup-tab"></span>

<div class="card">

  <div class="logo">✓ Taskly</div>

  <!-- Tabs -->
  <div class="tabs">
    <a href="#" class="tab-btn tab-login">Log In</a>
    <a href="#signup-tab" class="tab-btn tab-signup">Sign Up</a>
  </div>

  <!-- LOGIN FORM -->
  <div id="login-view" >
    <form method="POST" action="{{ url_for('login')}}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <div class="forgot"><a href="#">Forgot password?</a></div>
      <button class="btn-submit" type="submit">Log In</button>
    </form>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signup-view">
    <form method="POST" action="{{ url_for('register')}}">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" placeholder="Alex Johnson" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required />
      </div>
      <button class="btn-submit" type="submit">Create Account</button>
    </form>
  </div>

</div>
</div>
{% endblock %}
