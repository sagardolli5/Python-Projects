{% extends 'base.html' %}
{% block title %}Café Added{% endblock %}
{% block content %}

<div style="min-height:100vh;">
  <div class="cd-overlay" style="display:flex;">
    <div class="cd-box">
      <!-- ICON -->
      <div class="cd-icon-wrap">
        <div class="cd-icon">
          <img src="{{ url_for('static', filename='img/coffee-shop.png') }}" alt="coffee shop" width="40" height="40">
        </div>
      </div>
      <!-- TEXT -->
      <div class="cd-content">
        <h3 class="cd-title">Café Added!</h3>
        <p class="cd-message">
          <span class="cd-cafe-name">{{ cafe.name }}</span>
          has been successfully added to your café list.
        </p>
      </div>

      <div class="cd-divider"></div>

      <!-- ACTION -->
      <div class="cd-actions">
        <a href="{{ url_for('home') }}" class="cd-confirm" style="text-decoration:none; justify-content:center;">
          ✕ Back to Home
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock %}
