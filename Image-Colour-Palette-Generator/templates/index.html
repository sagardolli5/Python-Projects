{% extends "base.html" %}

{% block title %}Rainbow — Extract Colors{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
{% endblock %}

{% block content %}
<section class="hero">
  <div class="hero-text">
    <h1>What colors<br /><em>live inside</em><br />your image?</h1>
    <p class="subtitle">Upload any photo and we'll reveal<br />its ten most dominant colors.</p>
  </div>

  <div class="upload-area">
    <form action="{{url_for('result')}}" method="POST" enctype="multipart/form-data">
      <label class="drop-zone" for="image-input">
        <div class="drop-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <span class="drop-title">Choose an image</span>
        <span class="drop-hint">JPG, PNG, WEBP — any size</span>
        <input id="image-input" type="file" name="image" accept="image/*" required />
      </label>

      <button type="submit" class="btn-extract">
        Extract Colors
        <span class="btn-arrow">→</span>
      </button>
    </form>
  </div>
</section>

{% endblock %}
